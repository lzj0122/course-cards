<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M2/step-5 B 侧 3D 闪卡验收（dev）</title>
<link rel="stylesheet" href="../css/list.css">
<link rel="stylesheet" href="../css/cards.css">
<style>
  body { font: 16px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0 auto; max-width: 760px; padding: 24px 16px; color: #1c1917; background: #faf7f0; }
  h1 { font-size: 22px; }
  li.pass { color: #166534; } li.fail { color: #b91c1c; font-weight: 700; }
  #card-stage { margin: 16px 0; }
  iframe { border: 2px solid #4338ca; border-radius: 8px; display: block; margin: 16px 0; }
  #summary { font-weight: 700; }
  p.note { color: #57534e; font-size: 14px; }
</style>
</head>
<body>
<h1>B 侧验收：3D 翻转 / 键盘 / 降级 / 375px（dev 页，非产品 UI）</h1>
<p class="note">D027：B 先实现视图层，createDeck/renderDeck 接口为契约提案 v0.1（PR #8 待 A 确认）。本页 stub createDeck 仅 dev 用、非产品代码；视图零 storage 写入。560ms 依 D027 修订（DESIGN 原 520ms）。reduced-motion 以 CSSOM 断言（浏览器无法模拟 OS 偏好，如实披露）。</p>
<ol id="results"></ol>
<p id="summary">运行中…</p>
<div id="card-stage"></div>
<iframe id="f" width="375" height="720" title="375/360 宽度验收"></iframe>

<script type="module">
import { renderDeck } from '../js/deck-view.js';

/* dev-only stub：模拟 A 的 js/deck.js createDeck（契约提案 v0.1），非产品实现 */
function stubCreateDeck(points) {
  return {
    points, total: points.length, index: 0, flipped: false,
    get card() { return this.points[this.index] ?? null; },
    get done() { return this.total > 0 && this.index >= this.total; },
    flip() { if (!this.done) this.flipped = !this.flipped; },
    next() { this.index = Math.min(this.index + 1, this.total); this.flipped = false; }
  };
}
const PTS = [
  { id: 'p01', question: 'UDP 与 TCP 的核心区别？', answer: 'UDP 无连接、不可靠、低开销；TCP 面向连接、可靠传输。' },
  { id: 'p02', question: '什么是三次握手？', answer: 'SYN → SYN+ACK → ACK，建立 TCP 连接。' },
  { id: 'p03', question: 'DNS 的作用？', answer: '域名到 IP 的解析。' }
];

const results = [];
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
async function check(name, fn) {
  try { await fn(); results.push([true, name]); }
  catch (e) { results.push([false, `${name} → ${e && e.message}`]); }
}
const assert = (c, m) => { if (!c) throw new Error(m || '断言失败'); };
const stage = document.getElementById('card-stage');
const deck = stubCreateDeck(PTS);
const events = [];
stage.addEventListener('card-flip', (e) => events.push(['flip', e.detail]));
stage.addEventListener('card-next', (e) => events.push(['next', e.detail]));
const lsSnap = () => JSON.stringify(['studyDeck.deck.v1', 'studyDeck.progress.v1', 'studyDeck.prefs.v1'].map((k) => localStorage.getItem(k)));
const lsBefore = lsSnap();

await check('正面渲染 + 3D 结构（perspective/preserve-3d/backface）', async () => {
  renderDeck(deck, stage);
  const scene = stage.querySelector('.card-scene');
  const card = stage.querySelector('#flip-card');
  const faces = stage.querySelectorAll('.card-face');
  assert(stage.querySelector('.card-question').textContent === PTS[0].question, 'question');
  assert(stage.querySelector('.card-tag').textContent === '问题 Q1', 'tag');
  assert(getComputedStyle(scene).perspective === '1200px', 'perspective');
  assert(getComputedStyle(card).transformStyle === 'preserve-3d', 'preserve-3d');
  assert(faces.length === 2 && [...faces].every((f) => getComputedStyle(f).backfaceVisibility === 'hidden'), 'backface');
  assert(getComputedStyle(faces[1]).transform.startsWith('matrix3d(-1'), 'back rotateY180');
});
await check('翻转时长 560ms（D027）', async () => {
  const d = getComputedStyle(stage.querySelector('#flip-card')).transitionDuration;
  assert(d.includes('0.56s'), `duration=${d}`);
});
await check('点击翻面：class/aria/rotateY', async () => {
  stage.querySelector('#flip-card').click();
  await sleep(700); // 等 560ms 过渡落定再取终态矩阵
  const card = stage.querySelector('#flip-card');
  assert(card.classList.contains('flipped') && card.getAttribute('aria-pressed') === 'true', 'flipped');
  assert(getComputedStyle(card).transform.startsWith('matrix3d(-1'), 'rotateY');
});
await check('键盘 Enter/Space 翻面', async () => {
  const card = stage.querySelector('#flip-card');
  card.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }));
  await sleep(50);
  assert(!card.classList.contains('flipped'), 'Enter 应翻回');
  card.dispatchEvent(new KeyboardEvent('keydown', { key: ' ', bubbles: true, cancelable: true }));
  await sleep(50);
  assert(card.classList.contains('flipped'), 'Space 应翻面');
});
await check('下一张门控（先想后看）+ 进度 + 事件', async () => {
  const next = stage.querySelector('.card-next');
  assert(next.disabled === false, '翻面后应可用');
  next.click();
  await sleep(50);
  assert(deck.index === 1 && !deck.flipped, 'next 状态');
  assert(stage.querySelector('.card-progress span').textContent === '第 2 / 3 张', 'progress');
  assert(stage.querySelector('.card-next').disabled === true, '未翻面应禁用');
  const flips = events.filter((e) => e[0] === 'flip');
  assert(flips.length === 3 && flips[0][1].index === 0 && flips[0][1].flipped === true, 'card-flip detail');
  assert(events.some((e) => e[0] === 'next' && e[1].index === 0), 'card-next detail');
});
await check('视图零 storage 写入（不另存第二份）', async () => {
  assert(lsSnap() === lsBefore, 'storage 变化');
});
await check('遍历到完成 → 完成态', async () => {
  for (let i = 0; i < 5 && !deck.done; i++) {
    const card = stage.querySelector('#flip-card');
    if (card && !deck.flipped) card.click();
    await sleep(30);
    const next = stage.querySelector('.card-next');
    if (next && !next.disabled) next.click();
    await sleep(30);
  }
  assert(deck.done, 'done');
  assert(stage.querySelector('.card-done h3').textContent === '本轮 3 张已完成', 'done 文案');
});
await check('空 deck → 空态；M2 其余预留 id 零实现', async () => {
  renderDeck(stubCreateDeck([]), stage);
  assert(stage.querySelector('.card-empty h3'), 'empty');
  assert(!stage.querySelector('#rate-remembered, #rate-forgot, #stats-accuracy, #stats-mastered, #mistake-book'), '预留 id 被占用');
});
await check('正背纯文本（禁 HTML）', async () => {
  const d2 = stubCreateDeck([{ id: 'p01', question: '<img src=x onerror=alert(1)>', answer: '<b>bold</b>' }]);
  renderDeck(d2, stage);
  assert(stage.querySelector('.card-question').textContent === '<img src=x onerror=alert(1)>', 'question 纯文本');
  assert(stage.querySelector('.card-question').children.length === 0, 'question 无子元素');
  assert(stage.querySelector('.card-answer').children.length === 0, 'answer 无子元素');
});

/* 宽度验收：同源 srcdoc iframe（模块相对父页 base 解析） */
const f = document.getElementById('f');
const longQ = '长问题'.repeat(40);
const longA = '长答案内容，用于验证高度自适应与零横向溢出。'.repeat(30);
f.srcdoc = `<!doctype html><html lang="zh-CN"><head><meta charset="utf-8">
<link rel="stylesheet" href="../css/list.css"><link rel="stylesheet" href="../css/cards.css">
</head><body><div id="card-stage"></div>
<script type="module">
import { renderDeck } from '../js/deck-view.js';
const pts = [{ id: 'p01', question: ${JSON.stringify(longQ)}, answer: ${JSON.stringify(longA)} }];
const deck = { points: pts, total: 1, index: 0, flipped: false, get card() { return pts[0]; }, get done() { return false; }, flip() { this.flipped = !this.flipped; }, next() {} };
renderDeck(deck, document.getElementById('card-stage'));
window.__ready = true;
<\/script></body></html>`;
for (let i = 0; i < 60 && !f.contentWindow?.__ready; i++) await sleep(100);
const widthCheck = async (w, large) => {
  f.style.width = w + 'px';
  f.contentDocument.documentElement.classList.toggle('large-text', large);
  await sleep(120);
  const de = f.contentDocument.documentElement;
  assert(de.scrollWidth <= de.clientWidth, `${w}px large=${large} sw=${de.scrollWidth}`);
  return f.contentDocument.querySelector('#flip-card').getBoundingClientRect().height;
};
await check('375px 常规/大字零溢出 + 高度自适应', async () => {
  const h1 = await widthCheck(375, false);
  const h2 = await widthCheck(375, true);
  assert(h1 > 300 && h2 > h1, `高度未自适应 h1=${h1} h2=${h2}`);
});
await check('360px 常规/大字零溢出', async () => {
  await widthCheck(360, false);
  await widthCheck(360, true);
});
await check('reduced-motion CSSOM：150ms 淡入淡出 + 去 rotateY', async () => {
  let media = null;
  for (const sheet of document.styleSheets) {
    if (!sheet.href || !sheet.href.endsWith('cards.css')) continue;
    for (const r of sheet.cssRules) if (r.media && r.media.mediaText.includes('prefers-reduced-motion')) media = r;
  }
  assert(media, '缺 reduced-motion 媒体规则');
  const txt = [...media.cssRules].map((r) => r.cssText).join('\n');
  assert(txt.includes('150ms') && txt.includes('opacity'), '150ms 淡入淡出');
  assert(/\.card\.flipped\s*{\s*transform:\s*none/.test(txt), 'flipped 去 rotateY');
});

const ol = document.getElementById('results');
for (const [ok, name] of results) {
  const li = document.createElement('li');
  li.className = ok ? 'pass' : 'fail';
  li.textContent = `${ok ? 'PASS' : 'FAIL'} ${name}`;
  ol.appendChild(li);
  console[ok ? 'log' : 'error'](li.textContent);
}
const passed = results.filter((r) => r[0]).length;
document.getElementById('summary').textContent = `${passed}/${results.length} 通过`;
window.__done = true;
</script>
</body>
</html>

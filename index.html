<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF7F0">
<title>课件闪卡 · 考点清单</title>
<link rel="stylesheet" href="css/list.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='20' height='16' rx='4' fill='%234338CA'/%3E%3Crect x='9' y='11' width='20' height='16' rx='4' fill='%23F59E0B'/%3E%3C/svg%3E">
</head>
<body>

<header id="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./index.html" aria-label="课件闪卡 首页">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="5" width="20" height="16" rx="4" fill="var(--indigo-600)"/>
        <rect x="9" y="11" width="20" height="16" rx="4" fill="var(--amber-500)"/>
        <path d="M13 19h12M13 23h8" stroke="#1B1F3B" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">课件闪卡</span>
      <span class="brand-sub">CourseCards · 考点清单</span>
    </a>
    <button id="large-text-toggle" class="aa-toggle" type="button" aria-pressed="false" aria-label="大字模式开关" title="大字模式">Aa</button>
  </div>
</header>

<div id="mock-banner" role="status" hidden>
  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2 18 17H2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8v4M10 14.6v.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <span>示例模式：演示数据，非真实识别结果</span>
</div>

<main id="app">

  <section class="hero" aria-label="上传课件">
    <p class="hero-overline">上传课件 · AI 提取独立考点</p>
    <h1>把整页课件，<br>变成一叠会翻面的记忆卡</h1>
    <p class="hero-lead">截图或 PDF 都行。先列清单、再制卡自测，没记住的自动进错题本。</p>

    <div id="upload-zone" role="button" tabindex="0" aria-label="上传课件：拖拽或点击选择文件">
      <svg class="upload-icon" viewBox="0 0 48 48" aria-hidden="true">
        <rect x="8" y="6" width="26" height="32" rx="5" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M15 15h12M15 21h12M15 27h7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M33 30v12M27 36l6-6 6 6" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p class="upload-title">拖拽课件到这里，或点击选择</p>
      <p class="upload-hint">支持 PNG / JPG 截图 · 文字版或扫描版 PDF · ≤20MB · ≤30 页</p>
    </div>
    <input id="file-input" type="file" accept=".png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" hidden>

    <button id="use-mock-btn" type="button" hidden>使用示例课件</button>
  </section>

  <div id="extract-status" hidden aria-live="polite">
    <div class="status-card">
      <span class="status-dot" aria-hidden="true"></span>
      <p class="stage-text">读取课件…</p>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="解析进度">
        <div class="progress-fill"></div>
      </div>
    </div>
  </div>

  <div id="upload-error" hidden role="alert">
    <div class="error-card">
      <p class="error-title">解析失败</p>
      <p class="error-reason"></p>
      <button id="retry-btn" type="button">重试</button>
    </div>
  </div>

  <section class="list-section" aria-label="考点清单">
    <div class="list-head">
      <h2>考点清单</h2>
      <span id="point-count">共 0 个考点</span>
      <label class="select-all-label"><input id="select-all" type="checkbox">全选</label>
    </div>
    <div id="point-list"></div>
  </section>

</main>

<div class="bottom-bar">
  <button id="generate-deck-btn" type="button">生成闪卡</button>
</div>

<div id="toast-region" aria-live="polite"></div>

<script type="module" src="js/list.js"></script>
</body>
</html>
